<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Секретное приглашение</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    .heart {
      font-size: 50px;
      margin-bottom: 10px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #d6336c;
      font-size: 24px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 50px;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-yes {
      background-color: #ff4b72;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
    }

    .btn-yes:hover {
      background-color: #e0355b;
      transform: scale(1.05);
    }

    .btn-no {
      background-color: #e0e0e0;
      color: #666;
      position: relative;
    }

    .success-message {
      display: none;
    }

    .success-message h2 {
      color: #ff4b72;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div id="invite-content">
      <div class="heart">💖</div>
      <h1>У меня есть идея...</h1>
      <p>любишь меня?</p>
      
      <div class="buttons">
        <button class="btn-yes" onclick="acceptInvite()">кнч!</button>
        <button class="btn-no" id="noBtn" onmouseover="moveButton()">Нет</button>
      </div>
    </div>

    <div class="success-message" id="successMessage">
      <div class="heart">🎉</div>
      <h2>Ура! я тебя тоже!</h2>
      <p>отлично напиши мне!</p>
    </div>
  </div>

  <script>
    // Убегающая кнопка "Нет"
    function moveButton() {
      const btn = document.getElementById('noBtn');
      
      // Вычисляем случайное смещение
      const x = Math.random() * (window.innerWidth - btn.offsetWidth - 100) - (window.innerWidth / 2 - 100);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight - 100) - (window.innerHeight / 2 - 100);
      
      btn.style.position = 'fixed';
      btn.style.left = `calc(50% + ${x}px)`;
      btn.style.top = `calc(50% + ${y}px)`;
    }

    // Действие при клике на "Да"
    function acceptInvite() {
      document.getElementById('invite-content').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    }
</script>

</body>
</html>
